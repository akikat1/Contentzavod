[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contentzavod"
version = "0.1.0"
description = "Бесплатный автономный контент-завод: тема → драматургия → голоса → монтаж → публикация на 14+ площадок"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "pillow>=10.0",
  "httpx>=0.27",
  "edge-tts>=7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
# Необязательные тяжёлые компоненты: ставятся только на машине с GPU
gpu = ["torch", "timm", "faster-whisper>=1.0"]
r2 = ["boto3>=1.34"]

[project.scripts]
factory = "factory.core.cli:main"

[tool.setuptools.packages.find]
include = ["factory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ffmpeg: требует ffmpeg в PATH", "e2e: сквозной офлайн-прогон всех стадий (~40 с)"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
