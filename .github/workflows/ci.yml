name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Системные зависимости (ffmpeg, espeak-ng, шрифты с кириллицей)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
      - name: Установка
        run: pip install -e ".[dev]"
      - name: Линтер
        run: ruff check factory tests
      - name: Тесты (включая сквозной офлайн-прогон всех стадий)
        run: pytest -q
