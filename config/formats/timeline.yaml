id: timeline
name: Хронология
description: "События по датам, с цитатами эпохи."
title_styles: [statement, number]
skeleton:
  - {act: cold_open,   tension: 0.85, register: archive, cue: impact, note: "самая драматичная дата"}
  - {act: promise,     tension: 0.5,  register: text,              note: "открыть петлю"}
  - {act: context,     tension: 0.35, register: map,               note: "исходная точка"}
  - {act: rising,      tension: 0.55, register: archive,           note: "этап 1, цитата эпохи"}
  - {act: rising,      tension: 0.7,  register: counter,           note: "этап 2, числа"}
  - {act: explanation, tension: 0.45, register: stock,             note: "спад: как это выглядело для людей"}
  - {act: climax,      tension: 1.0,  register: parallax, cue: silence_before, note: "перелом, закрыть петлю"}
  - {act: finale,      tension: 0.55, register: text,              note: "callback"}
guidance: |
  Даты — анимированными счётчиками. Цитаты современников — роль quote,
  у speaker указывать era, чтобы включилась архивная обработка голоса.
